on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: true
      NETLIFY_SITE_ID:
        required: true
      INFISICAL_PROJECT_ID:
        required: true
      INFISICAL_SENTRY_TOKEN:
        required: true

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - run: git fetch --tags --force
      - uses: ./.github/actions/doxxer_install
      - id: version
        run: |
          VERSION=$(doxxer --config doxxer.web.toml next patch)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

  deploy:
    needs: compute-version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency: web-netlify-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compute-version.outputs.sha }}
      - uses: ./.github/actions/pnpm_install
      - uses: denoland/setup-deno@v2
      - name: Check Netlify deployment credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          : "${NETLIFY_AUTH_TOKEN:?Missing NETLIFY_AUTH_TOKEN repository secret}"
          : "${NETLIFY_SITE_ID:?Missing NETLIFY_SITE_ID repository secret}"
      - run: pnpm -F ui build
      - run: npm install -g netlify-cli@26.2.0
      - name: Build web for Netlify
        run: |
          netlify build \
            --context production \
            --filter @anlg/web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SENTRY_BUILD_SOURCEMAPS: "1"
          VITE_API_URL: https://api.anarlog.so
          VITE_APP_VERSION: ${{ needs.compute-version.outputs.version }}
      - name: Upload web source maps to Sentry
        run: |
          response=$(
            curl --fail --silent --show-error --get \
              --header "Authorization: Bearer $INFISICAL_TOKEN" \
              --data-urlencode "projectId=$INFISICAL_PROJECT_ID" \
              --data-urlencode "environment=prod" \
              --data-urlencode "secretPath=/anarlog/github" \
              --data-urlencode "expandSecretReferences=false" \
              "https://app.infisical.com/api/v4/secrets/SENTRY_AUTH_TOKEN"
          )
          if ! SENTRY_AUTH_TOKEN=$(jq -er '.secret.secretValue | select(length > 0)' <<< "$response"); then
            echo "::error::Missing SENTRY_AUTH_TOKEN in Infisical prod:/anarlog/github"
            exit 1
          fi
          export SENTRY_AUTH_TOKEN

          pnpm -F @anlg/web exec sentry-cli sourcemaps inject dist
          pnpm -F @anlg/web exec sentry-cli sourcemaps upload \
            --org fastrepl \
            --project anarlog \
            --release "$SENTRY_RELEASE" \
            dist
          find apps/web/dist -type f -name '*.map' -delete
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_SENTRY_TOKEN }}
          SENTRY_RELEASE: anarlog-web@${{ needs.compute-version.outputs.version }}
      - name: Deploy web to Netlify
        run: |
          netlify deploy \
            --prod \
            --no-build \
            --site "$NETLIFY_SITE_ID" \
            --filter @anlg/web \
            --message "web v$WEB_VERSION ($DEPLOY_SHA)"
        env:
          WEB_VERSION: ${{ needs.compute-version.outputs.version }}
          DEPLOY_SHA: ${{ needs.compute-version.outputs.sha }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  tag:
    needs: [compute-version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compute-version.outputs.sha }}
      - uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_sha: ${{ needs.compute-version.outputs.sha }}
          custom_tag: web_v${{ needs.compute-version.outputs.version }}
          tag_prefix: ""
